# Example SQL Server configuration. Do not commit real credentials.
spring.datasource.url=${DB_URL:jdbc:sqlserver://DESKTOP-V6KAVF8:1433;databaseName=MENSTYLE;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
menstyle.cors.allowed-origins=${MENSTYLE_CORS_ALLOWED_ORIGINS:http://localhost:5173}
